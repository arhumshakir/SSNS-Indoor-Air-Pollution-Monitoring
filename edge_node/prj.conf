# prj.conf -- IAQ edge node

# ---- Bluetooth: broadcaster / beacon only ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="IAQ-Node"

# ---- Peripherals ----
CONFIG_I2C=y
CONFIG_ADC=y

# ---- Sensor maths needs float printf ----
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# ---- Logging over RTT (works without a UART cable) ----
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# Roomier main stack for the sensor work
CONFIG_MAIN_STACK_SIZE=4096
