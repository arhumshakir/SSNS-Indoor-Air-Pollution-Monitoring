<svg viewBox="0 0 1180 860" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1180" height="860" fill="#0b0d10"/>
  <text x="40" y="48" fill="#ffffff" font-size="30" font-weight="700">Indoor Air Quality — Edge Node Wiring</text>
  <text x="40" y="76" fill="#8a949c" font-size="16">nRF52840 DK • I2C bus shared by all gas/temp sensors • SPS30 on 5V • LDR on AIN0</text>

  <!-- Legend -->
  <g font-size="14">
    <rect x="40" y="96" width="1100" height="40" rx="8" fill="#12161b" stroke="#1d2329"/>
    <line x1="60" y1="116" x2="92" y2="116" stroke="#ff5b5b" stroke-width="4"/><text x="98" y="121" fill="#cdd5da">5V</text>
    <line x1="150" y1="116" x2="182" y2="116" stroke="#ffb454" stroke-width="4"/><text x="188" y="121" fill="#cdd5da">3.3V</text>
    <line x1="260" y1="116" x2="292" y2="116" stroke="#cdd5da" stroke-width="4"/><text x="298" y="121" fill="#cdd5da">GND</text>
    <line x1="380" y1="116" x2="412" y2="116" stroke="#5bd0f2" stroke-width="4"/><text x="418" y="121" fill="#cdd5da">SDA (P0.26)</text>
    <line x1="540" y1="116" x2="572" y2="116" stroke="#bdf25b" stroke-width="4"/><text x="578" y="121" fill="#cdd5da">SCL (P0.27)</text>
    <line x1="700" y1="116" x2="732" y2="116" stroke="#c08bf2" stroke-width="4"/><text x="738" y="121" fill="#cdd5da">Analog (AIN0/P0.02)</text>
    <line x1="930" y1="116" x2="962" y2="116" stroke="#cdd5da" stroke-width="4" stroke-dasharray="2 4"/><text x="968" y="121" fill="#cdd5da">WAKE→GND</text>
  </g>

  <!-- MB102 power supply -->
  <g>
    <rect x="40" y="180" width="180" height="150" rx="10" fill="#161b22" stroke="#2a323b"/>
    <text x="130" y="208" fill="#ffffff" font-size="16" font-weight="600" text-anchor="middle">MB102 PSU</text>
    <text x="130" y="228" fill="#8a949c" font-size="12" text-anchor="middle">(USB / barrel in)</text>
    <circle cx="60" cy="262" r="5" fill="#ff5b5b"/><text x="74" y="267" fill="#cdd5da" font-size="13">+5V rail</text>
    <circle cx="60" cy="290" r="5" fill="#ffb454"/><text x="74" y="295" fill="#cdd5da" font-size="13">+3.3V rail</text>
    <circle cx="60" cy="318" r="5" fill="#cdd5da"/><text x="74" y="323" fill="#cdd5da" font-size="13">GND (both)</text>
  </g>

  <!-- nRF52840 DK -->
  <g>
    <rect x="40" y="400" width="200" height="320" rx="10" fill="#10243f" stroke="#2f5c93"/>
    <text x="140" y="430" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">nRF52840 DK</text>
    <text x="140" y="450" fill="#9fb6d4" font-size="12" text-anchor="middle">(USB powered)</text>
    <!-- pins -->
    <circle cx="220" cy="486" r="5" fill="#ffb454"/><text x="210" y="491" fill="#cdd5da" font-size="13" text-anchor="end">VDD 3.3V</text>
    <circle cx="220" cy="524" r="5" fill="#cdd5da"/><text x="210" y="529" fill="#cdd5da" font-size="13" text-anchor="end">GND</text>
    <circle cx="220" cy="562" r="5" fill="#5bd0f2"/><text x="210" y="567" fill="#cdd5da" font-size="13" text-anchor="end">P0.26 SDA</text>
    <circle cx="220" cy="600" r="5" fill="#bdf25b"/><text x="210" y="605" fill="#cdd5da" font-size="13" text-anchor="end">P0.27 SCL</text>
    <circle cx="220" cy="638" r="5" fill="#c08bf2"/><text x="210" y="643" fill="#cdd5da" font-size="13" text-anchor="end">P0.02 AIN0</text>
  </g>

  <!-- Ground bus (bottom) -->
  <line x1="60" y1="318" x2="60" y2="800" stroke="#cdd5da" stroke-width="3"/>
  <line x1="60" y1="800" x2="1120" y2="800" stroke="#cdd5da" stroke-width="3"/>
  <text x="600" y="822" fill="#8a949c" font-size="13" text-anchor="middle">COMMON GROUND — tie MB102 GND, DK GND and every sensor GND together (mandatory)</text>
  <line x1="220" y1="524" x2="120" y2="524" stroke="#cdd5da" stroke-width="3"/>
  <line x1="120" y1="524" x2="120" y2="800" stroke="#cdd5da" stroke-width="3"/>

  <!-- I2C trunk -->
  <line x1="280" y1="562" x2="280" y2="760" stroke="#5bd0f2" stroke-width="3"/>
  <line x1="220" y1="562" x2="280" y2="562" stroke="#5bd0f2" stroke-width="3"/>
  <line x1="320" y1="600" x2="320" y2="760" stroke="#bdf25b" stroke-width="3"/>
  <line x1="220" y1="600" x2="320" y2="600" stroke="#bdf25b" stroke-width="3"/>
  <text x="300" y="752" fill="#8a949c" font-size="12" text-anchor="middle">I2C trunk</text>

  <!-- pull-ups -->
  <g>
    <rect x="250" y="430" width="120" height="44" rx="8" fill="#12161b" stroke="#1d2329"/>
    <text x="310" y="450" fill="#cdd5da" font-size="12" text-anchor="middle">2× 4.7kΩ pull-ups</text>
    <text x="310" y="466" fill="#8a949c" font-size="11" text-anchor="middle">SDA &amp; SCL → 3.3V</text>
    <line x1="280" y1="474" x2="280" y2="562" stroke="#5bd0f2" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="320" y1="474" x2="320" y2="600" stroke="#bdf25b" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="300" y1="430" x2="300" y2="412" stroke="#ffb454" stroke-width="2"/>
    <line x1="200" y1="412" x2="300" y2="412" stroke="#ffb454" stroke-width="2"/>
  </g>

  <!-- 3.3V distribution from DK VDD -->
  <line x1="220" y1="486" x2="160" y2="486" stroke="#ffb454" stroke-width="3"/>
  <line x1="160" y1="486" x2="160" y2="160" stroke="#ffb454" stroke-width="3"/>
  <line x1="160" y1="160" x2="1020" y2="160" stroke="#ffb454" stroke-width="3"/>
  <text x="600" y="152" fill="#8a949c" font-size="12" text-anchor="middle">3.3V to SCD41 / CCS811 / MCP9808 (from DK VDD)</text>

  <!-- 5V distribution from MB102 -->
  <line x1="60" y1="262" x2="1020" y2="262" stroke="#ff5b5b" stroke-width="3"/>
  <text x="880" y="254" fill="#8a949c" font-size="12" text-anchor="middle">5V to SPS30 only</text>

  <!-- Sensor blocks -->
  <!-- SCD41 -->
  <g>
    <rect x="430" y="300" width="150" height="120" rx="10" fill="#12161b" stroke="#1d2329"/>
    <text x="505" y="326" fill="#bdf25b" font-size="15" font-weight="700" text-anchor="middle">SCD41</text>
    <text x="505" y="344" fill="#8a949c" font-size="11" text-anchor="middle">CO2 / T / RH</text>
    <text x="505" y="362" fill="#cdd5da" font-size="11" text-anchor="middle">I2C 0x62</text>
    <text x="505" y="392" fill="#cdd5da" font-size="11" text-anchor="middle">VIN·GND·SDA·SCL</text>
  </g>
  <line x1="505" y1="300" x2="505" y2="160" stroke="#ffb454" stroke-width="2"/>
  <line x1="470" y1="420" x2="470" y2="800" stroke="#cdd5da" stroke-width="2"/>
  <line x1="520" y1="420" x2="520" y2="562" stroke="#5bd0f2" stroke-width="2"/>
  <line x1="520" y1="562" x2="280" y2="562" stroke="#5bd0f2" stroke-width="2"/>
  <line x1="540" y1="420" x2="540" y2="600" stroke="#bdf25b" stroke-width="2"/>
  <line x1="540" y1="600" x2="320" y2="600" stroke="#bdf25b" stroke-width="2"/>

  <!-- CCS811 -->
  <g>
    <rect x="640" y="300" width="150" height="120" rx="10" fill="#12161b" stroke="#1d2329"/>
    <text x="715" y="326" fill="#bdf25b" font-size="15" font-weight="700" text-anchor="middle">CCS811</text>
    <text x="715" y="344" fill="#8a949c" font-size="11" text-anchor="middle">TVOC / eCO2</text>
    <text x="715" y="362" fill="#cdd5da" font-size="11" text-anchor="middle">I2C 0x5A</text>
    <text x="715" y="392" fill="#ff9b9b" font-size="11" text-anchor="middle">WAKE → GND !</text>
  </g>
  <line x1="715" y1="300" x2="715" y2="160" stroke="#ffb454" stroke-width="2"/>
  <line x1="680" y1="420" x2="680" y2="800" stroke="#cdd5da" stroke-width="2"/>
  <line x1="700" y1="420" x2="700" y2="800" stroke="#cdd5da" stroke-width="2" stroke-dasharray="2 4"/>
  <line x1="730" y1="420" x2="730" y2="562" stroke="#5bd0f2" stroke-width="2"/>
  <line x1="730" y1="562" x2="280" y2="562" stroke="#5bd0f2" stroke-width="2"/>
  <line x1="750" y1="420" x2="750" y2="600" stroke="#bdf25b" stroke-width="2"/>
  <line x1="750" y1="600" x2="320" y2="600" stroke="#bdf25b" stroke-width="2"/>

  <!-- MCP9808 -->
  <g>
    <rect x="850" y="300" width="150" height="120" rx="10" fill="#12161b" stroke="#1d2329"/>
    <text x="925" y="326" fill="#bdf25b" font-size="15" font-weight="700" text-anchor="middle">MCP9808</text>
    <text x="925" y="344" fill="#8a949c" font-size="11" text-anchor="middle">Temperature</text>
    <text x="925" y="362" fill="#cdd5da" font-size="11" text-anchor="middle">I2C 0x18</text>
    <text x="925" y="392" fill="#cdd5da" font-size="11" text-anchor="middle">VDD·GND·SDA·SCL</text>
  </g>
  <line x1="925" y1="300" x2="925" y2="160" stroke="#ffb454" stroke-width="2"/>
  <line x1="890" y1="420" x2="890" y2="800" stroke="#cdd5da" stroke-width="2"/>
  <line x1="940" y1="420" x2="940" y2="562" stroke="#5bd0f2" stroke-width="2"/>
  <line x1="940" y1="562" x2="280" y2="562" stroke="#5bd0f2" stroke-width="2"/>
  <line x1="960" y1="420" x2="960" y2="600" stroke="#bdf25b" stroke-width="2"/>
  <line x1="960" y1="600" x2="320" y2="600" stroke="#bdf25b" stroke-width="2"/>

  <!-- SPS30 (5V) -->
  <g>
    <rect x="430" y="540" width="170" height="150" rx="10" fill="#1b1414" stroke="#5c2f2f"/>
    <text x="515" y="566" fill="#ff8b6b" font-size="15" font-weight="700" text-anchor="middle">SPS30</text>
    <text x="515" y="584" fill="#8a949c" font-size="11" text-anchor="middle">PM1/2.5/4/10</text>
    <text x="515" y="602" fill="#cdd5da" font-size="11" text-anchor="middle">I2C 0x69</text>
    <text x="515" y="624" fill="#ff9b9b" font-size="11" text-anchor="middle">POWER = 5V</text>
    <text x="515" y="642" fill="#8a949c" font-size="10" text-anchor="middle">SEL pin → GND for I2C</text>
    <text x="515" y="660" fill="#8a949c" font-size="10" text-anchor="middle">logic is 3.3V-safe</text>
  </g>
  <line x1="460" y1="540" x2="460" y2="262" stroke="#ff5b5b" stroke-width="2"/>
  <line x1="490" y1="690" x2="490" y2="800" stroke="#cdd5da" stroke-width="2"/>
  <line x1="540" y1="690" x2="540" y2="715" stroke="#5bd0f2" stroke-width="2"/>
  <line x1="540" y1="715" x2="280" y2="715" stroke="#5bd0f2" stroke-width="2"/>
  <line x1="280" y1="715" x2="280" y2="562" stroke="#5bd0f2" stroke-width="2"/>
  <line x1="570" y1="690" x2="570" y2="730" stroke="#bdf25b" stroke-width="2"/>
  <line x1="570" y1="730" x2="320" y2="730" stroke="#bdf25b" stroke-width="2"/>
  <line x1="320" y1="730" x2="320" y2="600" stroke="#bdf25b" stroke-width="2"/>

  <!-- LDR divider -->
  <g>
    <rect x="850" y="540" width="170" height="150" rx="10" fill="#12161b" stroke="#1d2329"/>
    <text x="935" y="566" fill="#c08bf2" font-size="15" font-weight="700" text-anchor="middle">LDR divider</text>
    <text x="935" y="586" fill="#8a949c" font-size="11" text-anchor="middle">3.3V — LDR — A —</text>
    <text x="935" y="602" fill="#8a949c" font-size="11" text-anchor="middle">10kΩ — GND</text>
    <text x="935" y="628" fill="#cdd5da" font-size="11" text-anchor="middle">midpoint &quot;A&quot; → AIN0</text>
    <text x="935" y="648" fill="#8a949c" font-size="10" text-anchor="middle">(keep &lt; 3.3V)</text>
  </g>
  <line x1="900" y1="540" x2="900" y2="160" stroke="#ffb454" stroke-width="2"/>
  <line x1="970" y1="690" x2="970" y2="800" stroke="#cdd5da" stroke-width="2"/>
  <line x1="935" y1="690" x2="935" y2="638" stroke="#c08bf2" stroke-width="2"/>
  <line x1="850" y1="638" x2="220" y2="638" stroke="#c08bf2" stroke-width="2"/>

  <text x="40" y="848" fill="#566069" font-size="11">Pins shown are the nRF52840 DK defaults (i2c0 = P0.26/P0.27, AIN0 = P0.02). Change them in boards/nrf52840dk_nrf52840.overlay if needed.</text>
</svg>
