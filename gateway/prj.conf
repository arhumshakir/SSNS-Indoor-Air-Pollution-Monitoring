# prj.conf -- IAQ gateway (nRF52840 Dongle)

# ---- Bluetooth: observer / scanner only ----
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_DEVICE_NAME="IAQ-Gateway"

# ---- Native USB serial (CDC ACM) so the host gets a COM/tty port ----
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="IAQ Gateway"
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Route printk()/console to the CDC ACM port (see overlay chosen node)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=4096
